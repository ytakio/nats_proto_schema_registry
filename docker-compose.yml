services:
  nats:
    image: nats:2-alpine
    command:
      - "--jetstream"
      - "--store_dir"
      - "/data/jetstream"
      - "--http_port"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-jetstream-data:/data/jetstream

volumes:
  nats-jetstream-data:

